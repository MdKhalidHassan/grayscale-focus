<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      font-family: Arial, sans-serif;
      padding: 12px;
      margin: 0;
      background-color: #f8f9fa;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .label-text {
      font-size: 13px;
      font-weight: bold;
      color: #333;
    }
    /* Toggle switch CSS */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #2196F3;
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }
    button {
      padding: 8px 12px;
      font-size: 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    .btn-pause {
      background-color: #ff9800;
      color: white;
    }
    .btn-pause.active {
      background-color: #4CAF50;
    }
    .domain-info {
      font-size: 11px;
      color: #666;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row">
      <span class="label-text">Global Grayscale</span>
      <label class="switch">
        <input type="checkbox" id="globalToggle">
        <span class="slider"></span>
      </label>
    </div>
    
    <hr style="border: 0; border-top: 1px solid #ddd; margin: 2px 0;">
    
    <div class="domain-info" id="currentDomain">Domain: Loading...</div>
    
    <button id="siteToggleBtn" class="btn-pause">Pause for this site</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
